spring.application.name=aviso-guias

# --- CONFIGURAÇÃO DO H2 EM MODO ARQUIVO (Compatível com PostgreSQL) ---
spring.datasource.url=jdbc:h2:file:./data/aviso_guias_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / HIBERNATE ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- FLYWAY (Gerenciamento de Migrações) ---
spring.flyway.enabled=true
# Se os seus scripts atuais do Flyway usarem comandos exclusivos do PostgreSQL que o H2 rejeitar,
# podemos desativar o flyway para produção com o H2 e deixar o JPA gerenciar (spring.flyway.enabled=false).
# Mas tente rodar com true primeiro!

# --- DIRETÓRIOS E APIs ---
astecob.guias.diretorio=./guias

whatsapp.api.url=https://graph.facebook.com/v25.0
whatsapp.api.token=${WHATSAPP_TOKEN}
whatsapp.api.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}

# Versão atual do sistema (Usada pelo nosso sistema de release futuro)
app.version=1.0.0

