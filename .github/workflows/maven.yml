name: CI workflow 

on:
  push:
    branches: [ "main", "develop"]
  pull_request:
    branches: [ "main", "develop"]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DB_PASSWORD: senha-teste
      GMAIL_APP_PASSWORD: senha-teste
      WHATSAPP_TOKEN: token-teste
      WHATSAPP_PHONE_NUMBER_ID: id-teste

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn -B package -e --file pom.xml
