services:
  postgres:
    image: postgres:16
    container_name: aviso-guias-postgres
    environment:
      POSTGRES_DB: aviso_guias
      POSTGRES_USER: aviso_guias_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: